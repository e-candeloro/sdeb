[project]
name = "sdeb"
version = "0.2.1"
description = "Simple interactive helper for spawning SLURM shells via srun"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sdeb = "sdeb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdeb"]
